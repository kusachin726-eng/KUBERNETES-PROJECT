user  nginx;
worker_processes auto;
server_tokens off;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length  256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Global rate limiting & connection limiting
    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=${RATE_LIMIT_RATE:-5r/s};
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Map 429 status to a flag for conditional logging
    map $status $is_limited {
        429 1;
        default 0;
    }

    # Log format for rate-limited requests (includes forwarded and possible user headers)
    log_format rate_limited '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for" "$upstream_addr" "$upstream_http_x_user_id"';

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/rate_limited.log rate_limited if=$is_limited;

    upstream backend {
        server ${UPSTREAM_HOST:-127.0.0.1}:${UPSTREAM_PORT:-3005};
    }

    server {
        listen 80;
        server_name _;

        # NGINX metrics
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $http_x_user_id;

            limit_req zone=req_zone burst=${RATE_LIMIT_BURST:-10} nodelay;
            limit_conn addr ${RATE_LIMIT_CONN:-20};
        }

        error_page 429 = @too_many;
        location @too_many {
            add_header Retry-After 60;
            return 429 'Too Many Requests';
        }

        client_max_body_size ${CLIENT_MAX_BODY_SIZE:-10M};
    }
}
