worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format limit '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" user="$http_x_user_id" cookie="$cookie_user_id"';

  access_log /var/log/nginx/access.log main;

  # Performance & I/O
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Security: hide version
  server_tokens off;

  # --- gzip compression (safe for Next.js) ---
  gzip on;
  gzip_disable "msie6";
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_min_length 256;
  gzip_buffers 16 8k;
  gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/javascript
      application/x-javascript
      application/json
      application/xml
      image/svg+xml;

  # --- Rate Limit Zones ---
  limit_req_status 429;

  # API stricter rate
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

  # App/browser requests more lenient
  limit_req_zone $binary_remote_addr zone=app_limit:10m rate=20r/s;

  # Connection limit
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    root /app;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Allow only common methods
    if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS)$) {
      return 444;
    }

    # OPTIONAL Safer lightweight query abuse filter (no false positives like "scripture")
    if ($query_string ~* "(<|%3C|%3E|>|onerror|onload|alert\()") {
      return 403;
    }

    # Global connection limit
    limit_conn conn_limit 20;

    # Common static paths for Next.js
    location /_next/static/ {
      alias /app/.next/static/;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
      try_files $uri $uri/ =404;
    }

    location /static/ {
      alias /app/public/;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
      access_log off;
      try_files $uri $uri/ =404;
    }

    location = /runtime-env.js {
      alias /app/public/runtime-env.js;
      access_log off;
      add_header Cache-Control "no-store";
    }

    # ---- API ROUTES: strict rate limiting ----
    location /api/ {
      limit_req zone=api_limit burst=10 nodelay;

      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;

      # Headers for correct origin + real client IP
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSockets
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Enable buffering for JSON/API responses
      proxy_buffering on;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 90;
    }

    # ---- APP ROUTES: more relaxed limits ----
    location / {
      limit_req zone=app_limit burst=40;

      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;

      # Preserve host (needed for Next.js Server Actions)
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      # WebSockets
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Better browser perf for HTML/SSR
      proxy_buffering on;
      proxy_read_timeout 90;
    }

    # Rate limit response handler
    error_page 429 = @too_many;

    location @too_many {
      access_log /var/log/nginx/limit.log limit;
      add_header Retry-After 10 always;
      add_header Content-Type application/json;
      return 429 '{"error":"Too many requests","retry_after":10}';
    }

    client_max_body_size 50M;

    # Local NGINX status
    location /nginx_status {
      stub_status;
      allow 127.0.0.1;
      deny all;
      access_log off;
    }
  }
}